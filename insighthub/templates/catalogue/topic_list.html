{% extends "base.html" %}

{% block title %}Topics | InsightHub{% endblock %}

{% block content %}
    <h1>Topics</h1>

    <a href="{% url 'catalogue:topic-create' %}">
        + Create Topic
    </a>

    {% for topic in topics %}
        <article>
            <h2>
                <a href="{% url 'catalogue:topic-detail' topic.pk %}">
                    {{ topic.title }}
                </a>
            </h2>
            <p>{{ topic.description }}</p>
        </article>
    {% empty %}
        <p>No topics are available yet.</p>
    {% endfor %}
{% endblock %}
