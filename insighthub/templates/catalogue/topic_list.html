{% extends "base.html" %}

{% block title %}Topics | InsightHub{% endblock %}

{% block content %}
    <h1>Topics</h1>
    
    {% for topic in topics %}
        <article>
            <h2>{{ topic.title }}</h2>
            <p>{{ topic.description }}</p>
        </article>
    {% empty %}
        <p>No topics are available yet.</p>
    {% endfor %}
{% endblock %}
