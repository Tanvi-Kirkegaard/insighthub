{% extends "base.html" %}

{% block title %}{{ topic.name }} | InsightHub{% endblock %}

{% block content %}
    <article>
        <h1>{{ topic.title }}</h1>
        <p>{{ topic.description }}</p>
        <p>Created: {{ topic.created_at|date:"d M Y" }}</p>
    </article>

    <div class="actions">
        <a class="btn-secondary"
            href="{% url 'catalogue:topic-update' topic.pk %}">
                Edit Topic
        </a>

        <a class="btn-danger"
           href="{% url 'catalogue:topic-delete' topic.pk %}">
                Delete Topic
        </a>

        <a class="btn-secondary"
            href="{% url 'catalogue:topic-list' %}">
            <- Back to topics
        </a>
    </div>

{% endblock %}
